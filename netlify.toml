[build]
  publish = "public"
  # No build step — public/app.js is already bundled. Netlify still installs
  # the function dependencies from package.json.

[functions]
  node_bundler = "esbuild"

# /api/config, /api/team, /api/send-completion, /api/store
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
